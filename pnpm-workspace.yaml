allowBuilds:
  core-js: false
  unrs-resolver: false

autoDedupe: true

autoInstallPeers: false

lockfile:
  includeResolutionSettings: true

packages:
- "packages/ember-codemod-ember-render-helpers-to-v1"
- "packages/ember-render-helpers"
- "test-app"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*stylelint*"

resolvePeersFromWorkspaceRoot: false

verifyDepsBeforeRun: "warn"
